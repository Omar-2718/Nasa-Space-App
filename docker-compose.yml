# Skeleton: services get filled in during the event.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sand
      POSTGRES_PASSWORD: sand          # local dev only
      POSTGRES_DB: beneath
    ports: ["5433:5432"]       # 5432 is taken on the host
    volumes:
      - dbdata:/var/lib/postgresql/data
  # api:  Express + Prisma (./api) -> port 3000
  # ml:   FastAPI (./ml)   -> port 8000
  # web:  Vite dev server (./web) -> port 5173, or nginx serving web/dist + web_assets/
volumes:
  dbdata:
